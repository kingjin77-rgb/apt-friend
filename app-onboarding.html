<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아파트친구 앱 온보딩</title>
<style>
  :root{--bg:#FFFFFF;--card:#F7F7F8;--ink:#19191C;--ink-dim:#8B8D94;--accent:#FF5A36;--line:#EDEDEF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#F5F5F7;color:var(--ink);font-family:-apple-system,'Pretendard',sans-serif;
       min-height:100vh;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;padding:40px;}
  .phone{width:300px;height:620px;background:var(--bg);border-radius:38px;border:8px solid #1c1f1c;
         position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#1c1f1c;border-radius:0 0 14px 14px;z-index:5;}
  .screen{flex:1;display:none;flex-direction:column;padding:36px 22px 26px;}
  .screen.active{display:flex;}

  /* 화면1 인트로 */
  #s1{padding:0;justify-content:flex-end;text-align:left;}
  #s1 .photo{position:absolute;top:0;left:0;right:0;height:58%;background:url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=600&q=70') center/cover;}
  #s1 .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(0,0,0,.25) 100%);}
  #s1 .sheet{position:relative;z-index:2;background:var(--bg);border-radius:24px 24px 0 0;margin-top:52%;padding:28px 22px 26px;flex:1;display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(0,0,0,.06);}
  #s1 h1{font-size:20px;font-weight:800;line-height:1.4;margin-bottom:18px;color:var(--ink);}
  .concierge-badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;}
  .concierge-badge .brand{font-weight:800;font-size:15px;margin-bottom:4px;color:var(--ink);}
  .concierge-badge .desc{color:var(--ink-dim);font-size:11px;}
  .kakao-btn{background:#FEE500;color:#191919;border:none;border-radius:100px;padding:13px;font-weight:800;font-size:14px;width:100%;cursor:pointer;margin-top:auto;}

  /* 화면2 인증코드 */
  #s2{justify-content:center;text-align:center;}
  #s2 h1{font-size:19px;font-weight:800;line-height:1.4;margin-bottom:26px;}
  .code-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;}
  .code-box p{color:var(--ink-dim);font-size:13px;margin-bottom:14px;}
  .code-box input{width:100%;background:#F5F5F7;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font-size:14px;text-align:center;letter-spacing:.2em;}

  /* 화면3 매칭결과 */
  #s3{justify-content:flex-start;}
  #s3 h1{font-size:18px;font-weight:800;margin-bottom:18px;}
  .lawyer-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}
  .lawyer-card .unit{color:var(--accent);font-size:12px;font-weight:700;margin-bottom:8px;}
  .lawyer-row{display:flex;align-items:center;gap:12px;}
  .lawyer-avatar{width:44px;height:44px;border-radius:100px;background:#333;flex-shrink:0;}
  .lawyer-name{font-weight:700;font-size:15px;}
  .lawyer-tag{color:var(--ink-dim);font-size:11px;margin-top:2px;}
  .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .service-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;font-size:10px;color:var(--ink-dim);}

  .btn{background:var(--accent);color:#FFFFFF;border:none;border-radius:100px;padding:13px;font-weight:800;font-size:14px;width:100%;cursor:pointer;margin-top:auto;}
  .dots{display:flex;justify-content:center;gap:6px;margin:10px 0;}
  .dot{width:6px;height:6px;border-radius:100px;background:var(--line);}
  .dot.on{background:var(--accent);width:16px;}
  .caption{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:8px;}
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="screen active" id="s1">
    <div class="photo"></div>
    <div class="sheet">
      <h1>아파트 생활 고민,<br>내 손안에 해결</h1>
      <div class="concierge-badge">
        <div class="brand">아파트친구</div>
        <div class="desc">법률·교육·세무·회계<br>전문 프리미엄 컨시어지 서비스</div>
      </div>
      <button class="kakao-btn" onclick="go(2)">카카오로 시작하기</button>
    </div>
  </div>

  <div class="screen" id="s2">
    <h1>입주민 인증코드로<br>간편 접속!</h1>
    <div class="code-box">
      <p>안녕하세요<br>초대받은 인증코드를 입력해주세요</p>
      <input type="text" placeholder="인증코드를 입력해주세요" value="APT-2026-9931">
    </div>
    <button class="btn" onclick="go(3)">입력하기</button>
    <a href="start-association.html" style="display:block;text-align:center;margin-top:14px;color:var(--ink-dim);font-size:12px;text-decoration:none;">아직 인증코드가 없나요? 협의회 없이 시작하기 →</a>
  </div>

  <div class="screen" id="s3">
    <h1>어떠한 상담도 OK,<br>입주민과 연결!</h1>
    <div class="lawyer-card">
      <div class="unit">홍천시아 1차 이력화<br>안녕하세요,<br>202동 101호 김황희님</div>
      <div class="lawyer-row">
        <div class="lawyer-avatar"></div>
        <div>
          <div class="lawyer-name">판정의 담당 변호사</div>
          <div class="lawyer-tag">✓ 전관 변호사 · 배정 완료</div>
        </div>
      </div>
    </div>
    <button class="btn" style="margin-top:0;" onclick="alert('프로바입 서비스 시작 (데모)')">프로바입 서비스 시작</button>
    <div style="color:var(--ink-dim);font-size:11px;margin:14px 0 6px;">케이스 서비스</div>
    <div class="service-grid">
      <div class="service-item">⚖️ 법률</div>
      <div class="service-item">🎓 교육</div>
      <div class="service-item">💰 세무</div>
    </div>
  </div>

</div>

<div>
  <div class="dots">
    <div class="dot on" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  </div>
  <div class="caption">데모 화면 — 좌우 버튼으로 이동</div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">
    <button onclick="go(1)" style="padding:6px 14px;border-radius:100px;border:1px solid var(--line);background:#fff;color:var(--ink-dim);cursor:pointer;">1</button>
    <button onclick="go(2)" style="padding:6px 14px;border-radius:100px;border:1px solid var(--line);background:#fff;color:var(--ink-dim);cursor:pointer;">2</button>
    <button onclick="go(3)" style="padding:6px 14px;border-radius:100px;border:1px solid var(--line);background:#fff;color:var(--ink-dim);cursor:pointer;">3</button>
  </div>
</div>

<script>
function go(n){
  [1,2,3].forEach(i=>{
    document.getElementById('s'+i).classList.toggle('active', i===n);
    document.getElementById('d'+i).classList.toggle('on', i===n);
  });
}
</script>

</body>
</html>
