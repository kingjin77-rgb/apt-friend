<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 아파트친구</title>
<style>
  :root{--bg:#FFFFFF;--bg-card:#F7F7F8;--ink:#19191C;--ink-dim:#8B8D94;--accent:#FF5A36;--line:#EDEDEF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Pretendard',sans-serif;line-height:1.5;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:36px;width:100%;max-width:380px;}
  .logo{font-weight:800;font-size:18px;text-align:center;margin-bottom:6px;}
  .sub{color:var(--ink-dim);font-size:13px;text-align:center;margin-bottom:28px;}
  label{font-size:13px;color:var(--ink-dim);display:block;margin:14px 0 6px;}
  input{width:100%;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:14px;}
  input:focus{outline:none;border-color:var(--accent);}
  .btn-primary{width:100%;background:var(--accent);color:#FFFFFF;border:none;border-radius:100px;padding:13px;font-weight:700;font-size:14px;margin-top:20px;cursor:pointer;}
  .divider{display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:12px;margin:24px 0;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .social-row{display:flex;gap:10px;}
  .social-btn{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;font-size:12px;color:var(--ink);cursor:pointer;background:none;}
  .foot-links{display:flex;justify-content:center;gap:14px;margin-top:20px;font-size:12px;color:var(--ink-dim);}
  .foot-links a{color:inherit;text-decoration:none;}
  .verify-note{background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--ink-dim);margin-top:20px;}
  .verify-note b{color:var(--accent);}
</style>
</head>
<body>

<div class="card">
  <div class="logo">아파트친구</div>
  <div class="sub">단지 인증을 거친 회장님만 로그인 가능해요</div>

  <label>휴대폰 번호</label>
  <input type="tel" placeholder="010-0000-0000">

  <label>비밀번호</label>
  <input type="password" placeholder="비밀번호 입력">

  <button class="btn-primary" onclick="doLogin()">로그인</button>

  <div class="divider">간편 로그인</div>
  <div class="social-row">
    <button class="social-btn">네이버</button>
    <button class="social-btn">카카오</button>
    <button class="social-btn">Face ID</button>
  </div>

  <div class="verify-note">
    <b>실명·단지 검증</b> 완료 후에만 커뮤니티 이용이 가능해요. 최초 로그인 시 동호수 인증이 필요합니다.
  </div>

  <div class="foot-links">
    <a href="signup.html">회원가입</a>
    <a href="#">아이디/비밀번호 찾기</a>
    <a href="index.html">홈으로</a>
  </div>
</div>

<script>
function doLogin(){
  localStorage.setItem('jl_logged_in','1');
  window.location.href = 'community.html';
}
</script>

</body>
</html>
