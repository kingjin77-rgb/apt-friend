<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 | 아파트친구</title>
<style>
  :root{--bg:#FFFFFF;--card:#F7F7F8;--ink:#19191C;--ink-dim:#8B8D94;--accent:#FF5A36;--line:#EDEDEF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Pretendard',sans-serif;line-height:1.5;}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px;}
  header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .logo{font-weight:800;font-size:18px;}
  .back{color:var(--ink-dim);text-decoration:none;font-size:13px;}

  .profile-card{display:flex;align-items:center;gap:16px;padding:28px 0;border-bottom:1px solid var(--line);}
  .avatar{width:56px;height:56px;border-radius:100px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;}
  .p-name{font-size:17px;font-weight:800;}
  .p-unit{color:var(--ink-dim);font-size:13px;margin-top:2px;}
  .verified{display:inline-flex;align-items:center;gap:4px;background:rgba(255,90,54,.1);color:var(--accent);font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;margin-top:6px;}

  .section{padding:24px 0;border-bottom:1px solid var(--line);}
  .section h3{font-size:13px;color:var(--ink-dim);margin-bottom:14px;}
  .menu-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;text-decoration:none;color:var(--ink);font-size:14px;border-bottom:1px solid var(--line);}
  .menu-item:last-child{border-bottom:none;}
  .menu-item .arrow{color:var(--ink-dim);}

  .history-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .history-item .tag{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px;}
  .history-item .title{font-size:14px;font-weight:700;}
  .history-item .date{font-size:11px;color:var(--ink-dim);margin-top:4px;}

  .logout-btn{width:100%;background:none;border:1px solid var(--line);border-radius:100px;padding:13px;font-weight:700;font-size:14px;color:var(--ink-dim);cursor:pointer;margin:24px 0 40px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <div class="logo">아파트친구</div>
      <a class="back" href="community.html">← 커뮤니티</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="profile-card">
    <div class="avatar">회</div>
    <div>
      <div class="p-name">김황희 회장님</div>
      <div class="p-unit">OO아파트 · 202동 101호</div>
      <div class="verified">✓ 단지 인증 완료</div>
    </div>
  </div>

  <div class="section">
    <h3>내 활동</h3>
    <a class="menu-item" href="#"><span>내가 쓴 글</span><span class="arrow">›</span></a>
    <a class="menu-item" href="#"><span>내가 받은 답변</span><span class="arrow">›</span></a>
    <a class="menu-item" href="#"><span>스크랩</span><span class="arrow">›</span></a>
  </div>

  <div class="section">
    <h3>상담 내역</h3>
    <div class="history-item">
      <div class="tag">법률자문 · 답변완료</div>
      <div class="title">장기수선충당금 사용 범위 문의</div>
      <div class="date">2026.07.15</div>
    </div>
    <div class="history-item">
      <div class="tag">컨시어지 · 상담예약</div>
      <div class="title">세무 자문 - 관리비 부가세 처리</div>
      <div class="date">2026.07.20 · 담당: 이지훈 자문위원</div>
    </div>
  </div>

  <div class="section">
    <h3>설정</h3>
    <a class="menu-item" href="#"><span>알림 설정</span><span class="arrow">›</span></a>
    <a class="menu-item" href="#"><span>인증 정보 관리</span><span class="arrow">›</span></a>
    <a class="menu-item" href="membership-resident.html" onclick="return false;"><span>멤버십·포인트</span><span class="arrow">›</span></a>
    <a class="menu-item" href="#"><span>고객센터</span><span class="arrow">›</span></a>
  </div>

  <button class="logout-btn" onclick="localStorage.removeItem('jl_logged_in');window.location.href='login.html';">로그아웃</button>
</div>

</body>
</html>
