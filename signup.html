<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 | 아파트친구</title>
<style>
  :root{--bg:#FFFFFF;--bg-card:#F7F7F8;--ink:#19191C;--ink-dim:#8B8D94;--accent:#FF5A36;--line:#EDEDEF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Pretendard',sans-serif;line-height:1.5;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:36px;width:100%;max-width:420px;}
  .logo{font-weight:800;font-size:18px;text-align:center;margin-bottom:6px;}
  .sub{color:var(--ink-dim);font-size:13px;text-align:center;margin-bottom:24px;}
  .steps{display:flex;gap:6px;margin-bottom:24px;}
  .step{flex:1;height:4px;background:var(--line);border-radius:4px;}
  .step.done{background:var(--accent);}
  label{font-size:13px;color:var(--ink-dim);display:block;margin:12px 0 6px;}
  input,select{width:100%;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:14px;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .check-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--ink-dim);}
  .btn-primary{width:100%;background:var(--accent);color:#FFFFFF;border:none;border-radius:100px;padding:13px;font-weight:700;font-size:14px;margin-top:22px;cursor:pointer;}
  .foot-links{display:flex;justify-content:center;gap:14px;margin-top:20px;font-size:12px;color:var(--ink-dim);}
  .foot-links a{color:inherit;text-decoration:none;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">아파트친구</div>
  <div class="sub">단지 정보를 입력하면 법률자문 서비스를 시작할 수 있어요</div>
  <div class="steps"><div class="step done"></div><div class="step"></div><div class="step"></div></div>

  <label>이름</label>
  <input type="text" placeholder="홍길동">

  <label>직책</label>
  <select>
    <option>입주자대표회의 회장</option>
    <option>입주예정자협의회 회장</option>
    <option>관리사무소장</option>
    <option>동대표</option>
  </select>

  <label>휴대폰 번호</label>
  <div class="row2">
    <div><input type="tel" placeholder="010-0000-0000"></div>
    <button class="btn-primary" style="margin:0;width:auto;padding:0 16px;">인증</button>
  </div>

  <label>단지명</label>
  <input type="text" placeholder="예: OO아파트">

  <label>세대수</label>
  <input type="number" placeholder="예: 1200">

  <div class="check-row"><input type="checkbox"> 이용약관 및 개인정보처리방침에 동의합니다 (필수)</div>
  <div class="check-row"><input type="checkbox"> 마케팅 정보 수신에 동의합니다 (선택)</div>

  <button class="btn-primary" onclick="doSignup()">회원가입 완료</button>

  <div class="foot-links">
    <a href="login.html">이미 계정이 있으신가요? 로그인</a>
  </div>
  <div class="foot-links" style="margin-top:8px;">
    <a href="start-association.html">우리 단지에 협의회가 아직 없어요 →</a>
  </div>
</div>

<script>
function doSignup(){
  localStorage.setItem('jl_logged_in','1');
  alert('회원가입이 완료되었습니다. 커뮤니티로 이동합니다.');
  window.location.href = 'community.html';
}
</script>

</body>
</html>
