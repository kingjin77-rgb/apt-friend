<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실무 도구 | 아파트친구</title>
<style>
  :root{--bg:#FFFFFF;--card:#F7F7F8;--ink:#19191C;--ink-dim:#8B8D94;--accent:#FF5A36;--line:#EDEDEF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Pretendard',sans-serif;line-height:1.5;}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px;}
  header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .logo{font-weight:800;font-size:18px;}
  .back{color:var(--ink-dim);text-decoration:none;font-size:13px;}

  .head{padding:28px 0 8px;}
  .eyebrow{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:8px;}
  h1{font-size:24px;font-weight:800;}

  .tool{padding:28px 0;border-top:1px solid var(--line);}
  .tool h2{font-size:16px;font-weight:800;margin-bottom:6px;}
  .tool .desc{color:var(--ink-dim);font-size:13px;margin-bottom:18px;}

  label{font-size:13px;color:var(--ink-dim);display:block;margin:12px 0 6px;}
  select,input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit;}
  textarea{min-height:140px;resize:vertical;}
  .run-btn{background:var(--accent);color:#fff;border:none;border-radius:100px;padding:12px 22px;font-weight:700;font-size:14px;margin-top:14px;cursor:pointer;}

  .result{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-top:16px;display:none;}
  .result.show{display:block;}
  .result .big{font-size:20px;font-weight:800;color:var(--accent);}
  .result .sub{font-size:12px;color:var(--ink-dim);margin-top:4px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <div class="logo">아파트친구</div>
      <a class="back" href="index.html">← 홈으로</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="head">
    <div class="eyebrow">실무 도구</div>
    <h1>바로 계산하고, 바로 작성하세요</h1>
  </div>

  <div class="tool" id="defect-period">
    <h2>🔧 담보책임기간 계산기</h2>
    <div class="desc">하자 유형을 선택하면 사용검사일 기준 청구 가능 기한을 계산해요</div>
    <label>사용검사(승인)일</label>
    <input type="date" id="approval-date">
    <label>하자 유형</label>
    <select id="defect-type">
      <option value="2">마감공사 (미장·도장·타일 등) — 2년</option>
      <option value="3">전기·소방·승강기 설비공사 — 3년</option>
      <option value="4">방수공사 — 4년</option>
      <option value="5">지붕·옥상 방수 — 5년</option>
      <option value="10">내력구조부(균열·침하 등) — 10년</option>
    </select>
    <button class="run-btn" onclick="calcDefect()">계산하기</button>
    <div class="result" id="defect-result">
      <div class="big" id="defect-deadline"></div>
      <div class="sub">이 날짜까지 하자보수 청구가 가능해요 (공동주택관리법 시행령 별표 기준, 실제 적용은 계약·인도 조건에 따라 달라질 수 있어 최종 확인은 법률자문을 권장해요)</div>
    </div>
  </div>

  <div class="tool" id="content-cert">
    <h2>✉️ 내용증명 생성기</h2>
    <div class="desc">발신·수신 정보와 요청 내용을 입력하면 표준 양식으로 정리해드려요</div>
    <label>수신인 (시공사/시행사명)</label>
    <input type="text" id="cc-to" placeholder="예: OO건설 주식회사">
    <label>발신인 (협의회명)</label>
    <input type="text" id="cc-from" placeholder="예: OO아파트 입주예정자협의회">
    <label>요청 내용</label>
    <textarea id="cc-body" placeholder="예: 공용부 지하주차장 누수 하자에 대해 2026년 8월 15일까지 보수를 완료해주시기 바랍니다."></textarea>
    <button class="run-btn" onclick="genCC()">생성하기</button>
    <div class="result" id="cc-result">
      <div class="sub" id="cc-output" style="color:var(--ink);white-space:pre-line;"></div>
    </div>
  </div>
</div>

<script>
function calcDefect(){
  const d = document.getElementById('approval-date').value;
  if(!d){ alert('사용검사일을 입력해주세요'); return; }
  const years = parseInt(document.getElementById('defect-type').value);
  const date = new Date(d);
  date.setFullYear(date.getFullYear()+years);
  const deadline = date.toISOString().split('T')[0];
  document.getElementById('defect-deadline').textContent = deadline+' 까지';
  document.getElementById('defect-result').classList.add('show');
}
function genCC(){
  const to = document.getElementById('cc-to').value || '(수신인 미입력)';
  const from = document.getElementById('cc-from').value || '(발신인 미입력)';
  const body = document.getElementById('cc-body').value || '(요청 내용 미입력)';
  const today = new Date().toISOString().split('T')[0];
  const output = `내 용 증 명\n\n수신: ${to}\n발신: ${from}\n작성일: ${today}\n\n제목: 하자보수 등 이행 요청의 건\n\n${body}\n\n위 사항에 대해 조속한 조치를 요청드리며, 미이행 시 관련 법령에 따른 조치를 진행할 수 있음을 알려드립니다.\n\n${from} (인)`;
  document.getElementById('cc-output').textContent = output;
  document.getElementById('cc-result').classList.add('show');
}
</script>

</body>
</html>
